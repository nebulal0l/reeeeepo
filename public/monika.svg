<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00000033"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
  </defs>

  <!-- outer bg -->
  <rect width="480" height="360" fill="#fce4ec" rx="0"/>

  <!-- card -->
  <rect x="40" y="30" width="400" height="300" rx="18" fill="url(#pinkGrad)" filter="url(#shadow)"/>

  <!-- pink border inside card -->
  <rect x="52" y="42" width="376" height="276" rx="12" fill="none" stroke="#f48fb1" stroke-width="3"/>

  <!-- "Just Monika." text -->
  <text x="240" y="165" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="-1">Just Monika.</text>

  <!-- OK button -->
  <rect x="193" y="198" width="94" height="42" rx="21" fill="#c2185b"/>
  <rect x="196" y="201" width="88" height="36" rx="18" fill="#e91e63"/>
  <text x="240" y="226" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">OK</text>
</svg>
